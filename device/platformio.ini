; Two OpenTag devices, one project:
;
;   env:opentag_s3   the handheld — ESP32-S3 + SSD1351 OLED + 4 buttons
;   env:opentag_mini the screenless compact build — same board + Killer,
;                    one button, just-works BLE pairing (src/mini/main.cpp)
;
; Both speak the same BLE protocol (same service UUIDs, same command set),
; so the Android app and the web sync page drive either one.

[env:opentag_s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
build_src_filter = +<main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; USB MSC (the read-only "USB drive" mode) needs the TinyUSB device stack:
  ; USB_OTG mode + CDC on boot. The serial console then runs over USB-CDC.
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit SSD1351 library@^1.2.0
  adafruit/Adafruit GFX Library@^1.11.11
  h2zero/NimBLE-Arduino@^2.1.3

[env:opentag_mini]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
; mini/main.cpp includes the shared crypto/NFC headers from src/ root
build_src_filter = +<mini/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DOT_MINI=1
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.3
